name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kotakide_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/kotakide_ci"

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/kotakide_ci"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_NAME: "KotakIde Studio"
          INITIAL_ADMIN_EMAIL: "admin@kotakide.test"
          INITIAL_ADMIN_PASSWORD: "Placeholder!123"
          MAIL_PROVIDER: "log"
          STORAGE_DRIVER: "local"
